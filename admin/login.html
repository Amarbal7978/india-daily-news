<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login - India Daily News</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #123b70;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #123b70;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #loginStatus {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <h1>🛡️ Admin Login</h1>

    <p style="text-align:center;">
      India Daily News
    </p>

    <form id="loginForm">

      <label for="username">
        Username
      </label>

      <input
        id="username"
        type="text"
        autocomplete="username"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        🔐 Login
      </button>

    </form>

    <div id="loginStatus"></div>

  </div>


  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
          document.getElementById("username").value.trim();

        const password =
          document.getElementById("password").value;

        const status =
          document.getElementById("loginStatus");

        status.innerText =
          "🔄 Logging in...";

        try {

          const response =
            await fetch("../api/admin-auth", {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              credentials: "include",
              body: JSON.stringify({
                username,
                password
              })
            });

          const data =
            await response.json();

          if (!response.ok || !data.success) {
            throw new Error(
              data.message || "Login failed."
            );
          }

          status.innerText =
            "✅ Login successful...";

          window.location.href =
            "admin.html";

        } catch (error) {

          console.error(
            "Login error:",
            error
          );

          status.innerText =
            "❌ Invalid username or password.";

        }

      });

  </script>

</body>

</html>
